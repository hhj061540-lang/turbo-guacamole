name: Disconnect VPN Gateway Endpoint

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  disconnect-vpn:
    name: Execute VPN Disconnect Request
    runs-on: ubuntu-latest
    env:
      BASE: "https://wolfvpn-j6ved7rk.manus.space"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disconnect VPN
        run: |
          echo "Sending POST request to /api/vpn/disconnect..."
          curl -sS -X POST "$BASE/api/vpn/disconnect" \
            -H "Content-Type: application/json"

      - name: Verify Disconnection Status
        run: |
          echo "Fetching current VPN status after disconnect..."
          curl -sS "$BASE/api/vpn/status"

      - name: Verify Assigned IP Status
        run: |
          echo "Fetching IP endpoint status after disconnect..."
          curl -sS "$BASE/api/vpn/ip"

    
