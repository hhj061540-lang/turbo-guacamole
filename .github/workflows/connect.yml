name: Connect VPN Gateway Endpoint

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      country_code:
        description: 'Enter country code to connect to (e.g., US, JP, FR, GB) or leave blank for fastest'
        required: false
        default: 'US'

jobs:
  connect-vpn:
    name: Execute VPN Connect Request
    runs-on: ubuntu-latest
    env:
      BASE: "https://wolfvpn-j6ved7rk.manus.space"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to VPN Endpoint
        run: |
          TARGET="${{ github.event.inputs.country_code }}"
          # Clean whitespace and convert input to uppercase
          TARGET=$(echo "$TARGET" | tr '[:lower:]' '[:upper:]' | xargs)

          if [ -z "$TARGET" ]; then
            echo "No country code provided. Connecting to fastest server..."
            curl -sS -X POST "$BASE/api/vpn/connect" \
              -H "Content-Type: application/json" \
              -d '{"fastest": true}'
          else
            echo "Connecting to target country code: $TARGET..."
            curl -sS -X POST "$BASE/api/vpn/connect" \
              -H "Content-Type: application/json" \
              -d "{\"country_code\": \"$TARGET\"}"
          fi

      - name: Verify Active Connection Status
        run: |
          echo "Fetching current VPN status..."
          curl -sS "$BASE/api/vpn/status"

      - name: Check Assigned IP Address
        run: |
          echo "Fetching assigned IP..."
          curl -sS "$BASE/api/vpn/ip"
